name: Build & Test (iOS + watchOS)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      DD: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi -E 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Create simulators
        run: |
          xcrun simctl list runtimes
          ./scripts/ci_simulators.sh | tee sims.env
          cat sims.env >> "$GITHUB_ENV"

      - name: Build iOS app (with embedded Watch app)
        run: |
          set -o pipefail
          xcodebuild -project FitTrack.xcodeproj -scheme FitTrack -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$DD" \
            build 2>&1 | tee build-ios.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-ios.log

      - name: Build watchOS app
        run: |
          set -o pipefail
          xcodebuild -project FitTrack.xcodeproj -scheme FitTrackWatch -configuration Debug \
            -destination "generic/platform=watchOS Simulator" -derivedDataPath "$DD" \
            build 2>&1 | tee build-watch.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-watch.log

      - name: Build iCloud variant (compile check of the CloudKit code path)
        run: |
          set -o pipefail
          xcodebuild -project FitTrack.xcodeproj -scheme "FitTrack iCloud" -configuration Debug-iCloud \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$DD-icloud" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-icloud.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-icloud.log
          rm -rf "$DD-icloud"

      - name: Verify Watch app is embedded in iPhone app
        run: |
          APP="$DD/Build/Products/Debug-iphonesimulator/FitTrack.app"
          ls "$APP/Watch"
          test -d "$APP/Watch/FitTrackWatch.app"
          /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$APP/Watch/FitTrackWatch.app/Info.plist"

      - name: Unit + UI tests on iPhone 15 simulator
        run: |
          set -o pipefail
          xcrun simctl boot "$IPHONE_UDID" || true
          xcrun simctl bootstatus "$IPHONE_UDID" -b || true
          xcodebuild -project FitTrack.xcodeproj -scheme FitTrack \
            -destination "id=$IPHONE_UDID" -derivedDataPath "$DD" \
            -resultBundlePath build/ios-tests.xcresult \
            test 2>&1 | tee test-ios.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|\*\* TEST" || true
          grep -q "TEST SUCCEEDED" test-ios.log

      - name: Unit tests on Apple Watch simulator
        run: |
          xcrun simctl boot "$WATCH_UDID" || true
          xcrun simctl bootstatus "$WATCH_UDID" -b || true
          for attempt in 1 2; do
            rm -rf build/watch-tests.xcresult
            xcodebuild -project FitTrack.xcodeproj -scheme FitTrackWatch \
              -destination "id=$WATCH_UDID" -derivedDataPath "$DD" \
              -resultBundlePath build/watch-tests.xcresult \
              test > test-watch.log 2>&1 || true
            grep -E "error:|Test Case .* (passed|failed)|Executed|\*\* TEST" test-watch.log || true
            if grep -q "TEST SUCCEEDED" test-watch.log; then exit 0; fi
            if grep -q "Test Case .* failed" test-watch.log; then exit 1; fi
            echo "Watch simulator launch problem, retrying ($attempt)"
            xcrun simctl shutdown "$WATCH_UDID" || true
            xcrun simctl boot "$WATCH_UDID" || true
            xcrun simctl bootstatus "$WATCH_UDID" -b || true
          done
          exit 1

      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          for r in ios-tests watch-tests; do
            if [ -d build/$r.xcresult ]; then
              mkdir -p build/screenshots/$r
              xcrun xcresulttool export attachments --path build/$r.xcresult --output-path build/screenshots/$r > /dev/null 2>&1 || true
            fi
          done
          ls build/screenshots | head -50

      - name: Failure summary
        if: failure()
        run: |
          for f in build-ios.log build-watch.log build-icloud.log test-ios.log test-watch.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E "error:|: error|failed|XCTAssert|Fatal|crash|Testing failed|warning: .*(deprecated|never|unused)" "$f" | grep -v "^\s*$" | sort -u | head -80
          done

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            *.log
            build/screenshots
            build/vision-labels.txt
          if-no-files-found: ignore

      - name: Commit generated Xcode project
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/collect_screenshots.py build/screenshots/ios-tests docs/screenshots --clean
          python3 scripts/collect_screenshots.py build/screenshots/watch-tests docs/screenshots
          git add FitTrack.xcodeproj iOS/Info.plist Watch/Info.plist iOS/FitTrack.entitlements Watch/FitTrackWatch.entitlements
          git add -A docs/screenshots 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Xcode project already up to date"
          else
            git commit -m "chore: regenerate Xcode project (verified build)"
            git push origin HEAD:${GITHUB_REF_NAME} || echo "Push skipped (branch moved)"
          fi

      - name: Package project ZIP
        if: success()
        run: |
          rm -rf build/DerivedData
          mkdir -p dist
          zip -r -q dist/FITTRACK.zip . -x ".git/*" "build/*" "dist/*" "*.log" "sims.env"
          ls -lh dist

      - name: Upload project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FITTRACK-project
          path: dist/FITTRACK.zip
